name: monitor_btc_ai
description: "BTC Monitor AI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  fl_chart: ^1.3.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  http: ^1.4.0
  shared_preferences: ^2.5.6
  hive_ce_flutter: ^2.6.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - env.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#080B11"
  adaptive_icon_foreground: "assets/logo.png"